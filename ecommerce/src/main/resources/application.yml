spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wnplants?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: root
    password: 130500

  jpa:
    hibernate:
      ddl-auto: validate   # valida apenas, sem recriar tabelas
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  web:
    resources:
      add-mappings: true
      static-locations:
        - classpath:/static/
        - file:uploads/

  flyway:
    enabled: true
    # 🔸 Descomente as linhas abaixo se quiser resetar o banco automaticamente em DEV
    # clean-disabled: false
    # clean-on-validation-error: true
    # baseline-on-migrate: true

server:
  servlet:
    session:
      timeout: 60m
