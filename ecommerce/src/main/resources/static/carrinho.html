<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Carrinho - WNPlants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="css/carrinho.css"/>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">WN<span>Plants</span></a>
    <nav class="actions">
      <a href="login.html">Minha Conta</a>
      <a href="carrinho.html">🛒 <span id="cartCount" class="badge">0</span></a>
    </nav>
  </header>

  <main class="container">
    <h1>Carrinho de Compras</h1>

    <div class="cart-grid">
      
      <section class="cart-items">
        <div id="lista"></div>
        <a class="btn ghost btn-continue" href="index.html">← Continuar comprando</a>
      </section>

      <aside class="cart-summary">
        <div class="summary-card">
          <h2>Resumo do Pedido</h2>
          
          <div class="frete-section">
            <label for="cep">Calcular Frete</label>
            <div class="cep-row">
              <input id="cep" inputmode="numeric" placeholder="CEP" maxlength="9">
              <button id="btnCalcFrete" class="btn ghost small">OK</button>
            </div>
            <div id="opcoesFrete" class="frete-opcoes" hidden></div>
          </div>

          <hr class="divider">

          <div class="totals-section">
            <div class="row">
              <span>Subtotal</span>
              <span id="subtotal">R$ 0,00</span>
            </div>
            <div id="freteLinha" class="row muted" hidden>
              <span>Frete (<span id="freteNome"></span>)</span>
              <span id="freteValor">R$ 0,00</span>
            </div>
            <div class="row grand">
              <span>Total</span>
              <span id="total">R$ 0,00</span>
            </div>
          </div>

          <div class="actions-vertical">
            <button id="checkout" class="btn primary full">Finalizar Compra</button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <script src="js/carrinho.js" defer></script>
</body>
</html>
