<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Cadastro de Cliente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="css/cliente-cadastrar.css"/>
</head>
<body>
  <div class="container">
    <h1>Criar nova conta</h1>

    <form id="formCadastro" novalidate>
      
      <fieldset>
        <legend>Dados pessoais</legend>
        <div class="grid-3"> <label>Nome completo
            <input id="nome" type="text" maxlength="120" required placeholder="Nome e Sobrenome">
          </label>

          <label>CPF
            <input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
          </label>

          <label>Data de nascimento
            <input id="nascimento" type="date" required>
          </label>

          <label>Gênero
            <select id="genero" required>
              <option value="">Selecione…</option>
              <option value="FEMININO">Feminino</option>
              <option value="MASCULINO">Masculino</option>
              <option value="OUTRO">Outro</option>
              <option value="NAO_INFORMAR">Prefiro não informar</option>
            </select>
          </label>

          <label>E-mail
            <input id="email" type="email" maxlength="150" required placeholder="seuemail@exemplo.com">
          </label>

          <label>Senha
            <input id="senha" type="password" minlength="8" maxlength="72" required placeholder="Mínimo 8 caracteres">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço de faturamento (Principal)</legend>
        
        <div class="address-card billing">
          <div class="grid-4">
            <label>CEP
              <input id="fat_cep" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000" required>
            </label>

            <label>Logradouro
              <input id="fat_logradouro" type="text" required>
            </label>

            <label>Número
              <input id="fat_numero" type="text" required>
            </label>

            <label>Complemento
              <input id="fat_complemento" type="text">
            </label>

            <label>Bairro
              <input id="fat_bairro" type="text" required>
            </label>

            <label>Cidade
              <input id="fat_cidade" type="text" required>
            </label>

            <label>UF
              <input id="fat_uf" type="text" maxlength="2" required>
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereços de entrega</legend>

        <div class="copy-line">
          <button type="button" id="copiarFaturamento" class="btn">Copiar do faturamento</button>
          <button type="button" id="novoEndereco" class="btn primary">Adicionar novo endereço</button>
        </div>

        <div id="listaEntrega" class="enderecos">
          </div>
      </fieldset>

      <div class="actions">
        <a href="login.html" class="btn ghost">Cancelar</a>
        <button type="submit" class="btn primary" style="min-width: 200px;">Criar conta</button>
      </div>
    </form>
  </div>

  <template id="tplEndereco">
    <div class="address-card shipping endereco">
      <div class="grid-4">
        <label>Apelido (ex.: Trabalho)
          <input class="ent_apelido" type="text" maxlength="40" required placeholder="Nome do local">
        </label>

        <label>CEP
          <input class="ent_cep" type="text" inputmode="numeric" maxlength="9" required>
        </label>

        <label>Logradouro
          <input class="ent_logradouro" type="text" required>
        </label>

        <label>Número
          <input class="ent_numero" type="text" required>
        </label>

        <label>Complemento
          <input class="ent_complemento" type="text">
        </label>

        <label>Bairro
          <input class="ent_bairro" type="text" required>
        </label>

        <label>Cidade
          <input class="ent_cidade" type="text" required>
        </label>

        <label>UF
          <input class="ent_uf" type="text" maxlength="2" required>
        </label>
      </div>

      <div class="end-actions">
        <button type="button" class="btn danger removerEndereco">Remover endereço</button>
      </div>
    </div>
  </template>

  <script src="js/cliente-cadastrar.js"></script>
</body>
</html>
