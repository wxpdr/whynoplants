<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Cadastro de Cliente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="css/cliente-cadastrar.css"/>
</head>
<body>
  <div class="container">
    <h1>Criar nova conta</h1>

    <form id="formCadastro" novalidate>
      <fieldset class="grid-2">
        <legend>Dados pessoais</legend>

        <label>Nome completo
          <input id="nome" type="text" maxlength="120" required placeholder="Ex.: Maria Silva Souza">
        </label>

        <label>Gênero
          <select id="genero" required>
            <option value="">Selecione…</option>
            <option>Feminino</option>
            <option>Masculino</option>
            <option>Não-binário</option>
            <option>Prefiro não informar</option>
            <option>Outro</option>
          </select>
        </label>

        <label>Data de nascimento
          <input id="nascimento" type="date" required>
        </label>

        <label>CPF
          <input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
        </label>

        <label>E-mail
          <input id="email" type="email" maxlength="150" required placeholder="seuemail@exemplo.com">
        </label>

        <label>Senha
          <input id="senha" type="password" minlength="8" maxlength="72" required placeholder="mín. 8 caracteres">
        </label>
      </fieldset>

      <fieldset>
        <legend>Endereço de faturamento (obrigatório)</legend>

        <div class="grid-4">
          <label>CEP
            <input id="fat_cep" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000" required>
          </label>

          <label>Logradouro
            <input id="fat_logradouro" type="text" required>
          </label>

          <label>Número
            <input id="fat_numero" type="text" required>
          </label>

          <label>Complemento
            <input id="fat_complemento" type="text">
          </label>

          <label>Bairro
            <input id="fat_bairro" type="text" required>
          </label>

          <label>Cidade
            <input id="fat_cidade" type="text" required>
          </label>

          <label>UF
            <input id="fat_uf" type="text" maxlength="2" required>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereços de entrega (obrigatório, pode ter vários)</legend>

        <div class="copy-line">
          <button type="button" id="copiarFaturamento" class="btn">Copiar do faturamento</button>
          <button type="button" id="novoEndereco" class="btn ghost">Adicionar endereço</button>
        </div>

        <div id="listaEntrega" class="enderecos"></div>
      </fieldset>

      <div class="terms">
        <label class="chk">
          <input id="aceite" type="checkbox" required>
          Confirmo que os dados estão corretos.
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Criar conta</button>
        <a href="login.html" class="btn ghost">Cancelar</a>
      </div>
    </form>
  </div>

  <template id="tplEndereco">
    <div class="endereco">
      <div class="grid-4">
        <label>Apelido (ex.: Casa, Trabalho)
          <input class="ent_apelido" type="text" maxlength="40" required>
        </label>

        <label>CEP
          <input class="ent_cep" type="text" inputmode="numeric" maxlength="9" required>
        </label>

        <label>Logradouro
          <input class="ent_logradouro" type="text" required>
        </label>

        <label>Número
          <input class="ent_numero" type="text" required>
        </label>

        <label>Complemento
          <input class="ent_complemento" type="text">
        </label>

        <label>Bairro
          <input class="ent_bairro" type="text" required>
        </label>

        <label>Cidade
          <input class="ent_cidade" type="text" required>
        </label>

        <label>UF
          <input class="ent_uf" type="text" maxlength="2" required>
        </label>
      </div>

      <div class="end-actions">
        <button type="button" class="btn danger removerEndereco">Remover</button>
      </div>
    </div>
  </template>

  <script src="js/cliente-cadastrar.js"></script>
</body>
</html>
