<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Login - WNPlants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  
  <div class="split-container">
    
    <div class="card login-side">
      <h1>Bem-vindo de volta!</h1>
      <p class="subtitle">Insira seus dados para continuar.</p>

      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="seu@email.com" autofocus />

      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="••••••••" />

      <div class="actions">
        <button id="ok" class="btn primary">Entrar</button>
      </div>

      <p id="msg" class="msg"></p>
      
      <div class="register-link">
        Ainda não tem conta? <a href="cliente-cadastrar.html">Cadastre-se aqui</a>
      </div>
    </div>

    <div class="card welcome-side">
      <div class="brand-big">WNPlants</div>
      <h2>Cultive seu espaço</h2>
      <p>
        Do estoque à sua casa, levamos vida e natureza para transformar o seu ambiente.
      </p>
    </div>

  </div>

  <script>window.API = "http://localhost:8080";</script>
  <script src="js/login.js"></script>
</body>
</html>
