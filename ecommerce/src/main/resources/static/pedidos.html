<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Pedidos (Admin/Estoque)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/pedidos.css" />
</head>
<body>
  
  <main class="main-content">
    <div class="card">
      <div class="topbar">
        <h2>Pedidos</h2>
        <div class="spacer"></div>
        <button class="btn ghost" onclick="Auth.redirectHomeByPerfil()">Início</button>
      </div>

      <p class="muted">
        Gerenciamento de status de pedidos.
      </p>

      <div id="pedidos-container">
        <table class="tabela-pedidos">
          <thead>
            <tr>
              <th>#</th>
              <th>Data</th>
              <th>Status</th>
              <th>Total</th>
              <th style="text-align: right;">Ações</th>
            </tr>
          </thead>
          <tbody id="pedidos-body">
            <tr>
              <td colspan="5" class="muted" style="text-align: center; padding: 20px;">Carregando pedidos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>window.API = "http://localhost:8080";</script>
  
  <script src="js/auth.js"></script>
  <script src="js/pedidos.js"></script>
  <script>
    if(window.Auth) {
        Auth.preventBfcache();
        Auth.ensureLoggedIn(); 
    }
  </script>
</body>
</html>
