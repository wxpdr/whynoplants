<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Lista de Usuários</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/usuario.css" />
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Lista de Usuários</h1>
      <div class="spacer"></div>
      <button id="btnNovo" class="btn primary">+ Novo Usuário</button>
      <button id="logout" class="btn ghost" style="margin-left: 10px;">Sair</button>
    </div>

    <div class="toolbar">
      <input id="busca" type="text" placeholder="Procurar por nome..." />
      <button id="btnBuscar" class="btn">Buscar</button>
    </div>

    <table id="grid">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Status</th>
          <th>Perfil</th>
          <th style="text-align: right;">Ações</th>
        </tr>
      </thead>
      <tbody>
        </tbody>
    </table>

    <dialog id="dlg">
      <form method="dialog" id="formDlg" autocomplete="off">
        <h3 id="dlgTitle">Novo usuário</h3>
        <input type="hidden" id="u-id" />
        
        <div class="form-grid">
            <div class="column">
                <div>
                  <label for="u-nome">Nome</label>
                  <input id="u-nome" required />
                </div>
                
                <div>
                  <label for="u-cpf">CPF (11 dígitos)</label>
                  <input id="u-cpf" maxlength="11" pattern="\d{11}" placeholder="Apenas números" required />
                </div>
                
                <div>
                  <label for="u-email">E-mail</label>
                  <input id="u-email" type="email" required />
                </div>
                
                <div>
                  <label for="u-perfil">Perfil</label>
                  <select id="u-perfil">
                    <option value="Administrador">Administrador</option>
                    <option value="Estoquista">Estoquista</option>
                  </select>
                </div>
            </div>

            <div class="column">
                <div>
                  <label for="u-nova">Nova senha</label>
                  <input id="u-nova" type="password" placeholder="********" />
                </div>
                
                <div>
                  <label for="u-confirma">Confirmar senha</label>
                  <input id="u-confirma" type="password" placeholder="********" />
                </div>
                
                <div class="spacer-senha"></div>
            </div>
        </div>

        <p id="msg" class="msg"></p>

        <div class="actions">
          <button class="btn ghost" id="cancelDlg">Cancelar</button>
          <button class="btn primary" id="okDlg">Salvar</button>
        </div>
      </form>
    </dialog>
  </div>

  <script>window.API = "http://localhost:8080";</script>

  <script src="js/usuario.js"></script>
  <script src="js/auth.js"></script> 
  <script>
    if(window.Auth && window.Auth.ensureAdmin) {
        window.Auth.preventBfcache();
        window.Auth.ensureAdmin(); 
    }
  </script>

</body>
</html>
